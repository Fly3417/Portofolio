<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pesan Terkirim // SevenByte</title>
<link rel="stylesheet" href="style.css">
<style>
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    background-color: var(--bg);
    text-align: center;
    padding: 20px;
  }
  .success-box {
    background: var(--bg-card);
    border: 1px solid var(--border);
    padding: 40px;
    border-radius: 10px;
    max-width: 500px;
    box-shadow: 0 0 20px var(--border-glow);
  }
  .success-box h1 {
    color: var(--accent);
    margin-bottom: 15px;
    font-size: 24px;
  }
  .success-box p {
    color: var(--fg-dim);
    margin-bottom: 25px;
    font-size: 14px;
  }
  .btn-back {
    display: inline-block;
    padding: 10px 20px;
    background: var(--accent);
    color: var(--bg);
    text-decoration: none;
    border-radius: 5px;
    font-weight: bold;
    transition: 0.2s;
  }
  .btn-back:hover {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
  }
</style>
</head>
<body>

<div class="success-box">
  <h1>// Pesan Terkirim</h1>
  <p>Terima kasih telah menghubungi saya. Pesan kamu sudah masuk ke sistem dan akan segera saya balas melalui email.</p>
  <a href="index.html" class="btn-back">← Kembali ke Beranda</a>
</div>

</body>
</html>
